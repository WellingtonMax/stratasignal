# Historic filename retained while migrating away from CodeQL uploads.
# This private repository does not have GitHub Code Scanning enabled.
# Scanners run inside GitHub Actions; source code is not sent to a scanning SaaS.
name: StrataSignal - security checks (OSS)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned open-source security scanners
        run: python -m pip install bandit==1.9.4 semgrep==1.184.0
      - name: Audit Python sources with Bandit (medium/high severity and confidence)
        run: bandit -r stratasignal -ll -ii --format json --output bandit-results.json
      - name: Audit Python and JavaScript sources with Semgrep
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: semgrep scan --config p/security-audit --metrics=off --severity ERROR --error --json --output semgrep-results.json stratasignal
      - name: Save reports inside the private repository
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report-${{ github.run_id }}
          path: |
            bandit-results.json
            semgrep-results.json
          if-no-files-found: warn
          retention-days: 14
