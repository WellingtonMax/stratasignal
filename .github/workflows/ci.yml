name: StrataSignal - tests and packaging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -S -m unittest discover -s tests -v

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-ml.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m stratasignal demo --out /tmp/stratasignal-ci-demo

  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/stratasignal-wheels
      - run: python -m venv /tmp/stratasignal-installed
      - name: Install and run packaged assets outside the checkout
        run: |
          /tmp/stratasignal-installed/bin/python -m pip install --no-deps /tmp/stratasignal-wheels/stratasignal-*.whl
          cp tests/installed_smoke.py /tmp/stratasignal-installed-smoke.py
          cd /tmp
          /tmp/stratasignal-installed/bin/python -m stratasignal demo --with-comparison --out /tmp/stratasignal-package-demo --without-ml
          /tmp/stratasignal-installed/bin/python -m stratasignal.build_demo --out /tmp/stratasignal-package-ui --without-ml
          /tmp/stratasignal-installed/bin/python -c "from stratasignal.workbench import create_server; s, _, _ = create_server(0); assert s.server_address[0] == '127.0.0.1'; s.server_close()"
          /tmp/stratasignal-installed/bin/python /tmp/stratasignal-installed-smoke.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit the complete pinned optional ML dependency set
        run: python -m pip_audit --disable-pip --no-deps --strict -r requirements-ml.txt
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
